<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 星曆 logo. Gold on dark tabs; deeper gold on light tabs so the star stays visible. -->
  <style>
    .line { fill: none; stroke: #B48A4C; }
    .star { fill: #D7A765; }
    .core { fill: #B48A4C; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #D7A765; }
      .star { fill: #F4D9A2; }
      .core { fill: #D7A765; }
    }
  </style>
  <circle class="line" cx="32" cy="32" r="23" stroke-width="1.6"/>
  <ellipse class="line" cx="32" cy="32" rx="27" ry="11" stroke-width="1.3" transform="rotate(-35 32 32)"/>
  <path class="star" d="M32 18 L35.5 28.5 L46 32 L35.5 35.5 L32 46 L28.5 35.5 L18 32 L28.5 28.5 Z"/>
  <circle class="core" cx="32" cy="32" r="3"/>
</svg>
